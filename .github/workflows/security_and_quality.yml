name: Security & Code Quality Audit

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write

jobs:
  # 1. ANALISIS KEAMANAN & VULNERABILITY SCAN
  security-scan:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review (PR Only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Scan Repository with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # 2. DETEKSI BUG, ERROR & KUALITAS KODE
  code-quality-and-test:
    name: Lint, Static Analysis & Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5 # Diperbarui ke v5
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5 # Diperbarui ke v5

      - name: Auto-fix Code Format (Spotless)
        run: ./gradlew spotlessApply

      - name: Commit changes (If format was fixed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix formatting via Spotless"

      - name: Run Android Lint (Non-blocking)
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Run Unit Tests
        id: run_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight Migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

  # 3. UI TESTING, SIMULASI ANDROID & CRASH LOGS
  android-ui-test:
    name: Android UI Tests & Crash Detection
    runs-on: ubuntu-latest
    
    # RAHASIA 1: Batasi memori JVM agar tidak memakan RAM Emulator
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
    timeout-minutes: 30 # Mencegah tagihan menit GitHub bengkak jika stuck

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # RAHASIA 2: Gunakan sistem Cache AVD (Mempercepat booting hingga 3x lipat)
      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Key unik berdasarkan konfigurasi emulator kita
          key: avd-34-aosp_atd-x86_64

      # RAHASIA 3: Script KVM standar dari dokumentasi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # RAHASIA 4: Generate Snapshot (Hanya berjalan jika cache belum ada/baru pertama kali)
      - name: Generate AVD Snapshot for Caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd # Menggunakan ATD (Automated Test Device) yang jauh lebih ringan
          arch: x86_64
          profile: Nexus 6
          cores: 2 # Pembatasan CPU
          ram-size: 2048M # Pembatasan RAM
          sdcard-path-or-size: 100M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # RAHASIA 5: Jalankan Tes dari Snapshot (-no-snapshot-save)
      - name: Run Android Emulator & Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: Nexus 6
          cores: 2
          ram-size: 2048M
          sdcard-path-or-size: 100M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell input keyevent 82
            
            # --- TAMBAHAN BARU: Install APK ke dalam emulator ---
            # Pastikan path ini sesuai dengan lokasi output APK di project kamu
            adb install app/build/outputs/apk/debug/app-x86_64-debug.apk || adb install app/build/outputs/apk/debug/app-universal-debug.apk
            
            # Jalankan monkey test
            adb shell monkey -p eu.kanade.tachiyomi -v 5000 || true
            
            # Ambil log error
            adb logcat -d *:E > emulator-crash-log.txt
            
            # Screenshot
            adb shell screencap -p /sdcard/screencap.png || true
            adb pull /sdcard/screencap.png /tmp/android-emulator-screenshot.png || true
            
            echo "Test and log extraction completed."


      - name: Upload Emulator Crash Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-crash-log-${{ github.sha }}
          path: emulator-crash-log.txt

      - name: Upload Emulator Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot-${{ github.sha }}
          path: /tmp/android-emulator-screenshot.png
