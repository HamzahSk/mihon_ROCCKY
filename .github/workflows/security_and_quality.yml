name: Security & Code Quality Audit

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write

jobs:
  # 1. ANALISIS KEAMANAN & VULNERABILITY SCAN
  security-scan:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review (PR Only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Scan Repository with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # 2. DETEKSI BUG, ERROR & KUALITAS KODE
  code-quality-and-test:
    name: Lint, Static Analysis & Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Auto-fix Code Format (Spotless)
        run: ./gradlew spotlessApply

      - name: Commit changes (If format was fixed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix formatting via Spotless"

      # Bagian ini diatur agar tetap lanjut walau Lint menemukan bug/error
      - name: Run Android Lint (Non-blocking)
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Run Unit Tests
        id: run_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight Migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest


  # 3. UI TESTING, SIMULASI ANDROID & CRASH LOGS
  android-ui-test:
    name: Android UI Tests & Crash Detection
    # Catatan: Sangat disarankan menggunakan macOS runner untuk emulator 
    # karena mendukung Hardware Acceleration (HAXM), sehingga jauh lebih cepat dan stabil.
    runs-on: macos-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Emulator & Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30 # Versi Android (API 30 = Android 11)
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # Di bagian 'script' ini kita mengatur apa yang dilakukan emulator
          script: |
            # OPSI 1: Jika kamu punya UI Test (Espresso)
            # ./gradlew connectedDebugAndroidTest
            
            # OPSI 2: Jika belum punya test script, gunakan Monkey Test untuk mencari crash acak (hapus tanda # di bawah ini)
            adb shell monkey -p eu.kanade.tachiyomi -v 5000 || true
            
            # Ekspor semua logcat (termasuk crash & error) ke sebuah file txt
            adb logcat -d *:E > emulator-crash-log.txt

      - name: Upload Emulator Crash Logs
        if: always() # Pastikan log tetap di-upload walaupun test-nya gagal (crash)
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-crash-logs-${{ github.sha }}
          path: emulator-crash-log.txt
          